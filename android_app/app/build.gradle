plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nx2a.doraemon'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.nx2a.doraemon'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '1.1.2-hybrid8'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        resValues false
    }

    packaging {
        jniLibs {
            // Required for Android 15/16 16 KB ELF page-alignment directly inside the APK
            useLegacyPackaging = false
        }
    }

    androidResources {
        // Keep pre-compressed zstd shader bundle and NXPT recipes uncompressed for zero-overhead reads
        noCompress += ['dmsv', 'nxpatch']
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pure Android SDK implementation: zero external Maven dependencies for 100% offline reproducibility
}
